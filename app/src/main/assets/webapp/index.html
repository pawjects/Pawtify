<!doctype html>
<html lang="en" data-theme="amoled">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A privacy-friendly, browser-based static music player featuring local playlist controls and distraction-free streaming."
    />
    <meta property="og:title" content="Pawtify" />
    <meta
      property="og:description"
      content="A privacy-friendly, browser-based static music player featuring local playlist controls and distraction-free streaming."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/assets/pawtify.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pawtify" />
    <meta name="twitter:description" content="A privacy-friendly, browser-based static music player featuring local playlist controls and distraction-free streaming." />
    <meta name="twitter:image" content="/assets/pawtify.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Pawtify" />
    <meta name="application-name" content="Pawtify" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <title>Pawtify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <script>
      // Immediate self-healing recovery from stale cached syntax errors
      window.addEventListener('error', function (e) {
        if (e && e.message && e.message.includes('Illegal return statement')) {
          console.warn('[Pawtify] Stale cached syntax detected; clearing caches and reloading...');
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).then(function () {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  regs.forEach(function (r) { r.unregister(); });
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            });
          }
        }
      });
    </script>
    <link rel="stylesheet" href="/styles.css?v=3.0.0-md3" />
  </head>
  <body>
    <!-- PWA Install Prompt -->
    <div
      class="pwa-install-banner"
      id="pwa-install-banner"
      style="display: none"
    >
      <div class="pwa-install-content">
        <img src="/assets/pawtify.png" alt="" class="pwa-install-icon" />
        <div class="pwa-install-text">
          <strong>Install Pawtify</strong>
          <span>Add to home screen for the best experience</span>
        </div>
        <button class="pwa-install-btn" id="pwa-install-btn" type="button">
          Install
        </button>
        <button
          class="pwa-install-close"
          id="pwa-install-close"
          type="button"
          aria-label="Close"
        >
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
    </div>

    <div class="app-container">
      <!-- Sidebar (Desktop) -->
      <aside class="sidebar" aria-label="Main navigation">
        <div class="sidebar-brand">
          <img src="/assets/pawtify.png" alt="Pawtify" class="sidebar-logo" />
          <span class="sidebar-brand-text">Pawtify</span>
        </div>

        <nav class="sidebar-nav">
          <div class="sidebar-nav-indicator" id="sidebar-nav-indicator"></div>
          <button class="nav-link active" data-route="/" type="button">
            <span class="material-symbols-rounded">home</span>
            <span>Home</span>
          </button>
          <button class="nav-link" data-route="/search" type="button">
            <span class="material-symbols-rounded">search</span>
            <span>Search</span>
          </button>
          <button class="nav-link" data-route="/library" type="button">
            <span class="material-symbols-rounded">library_music</span>
            <span>Your Library</span>
          </button>
          <button class="nav-link" data-route="/you" type="button">
            <span class="material-symbols-rounded">account_circle</span>
            <span>You</span>
          </button>
        </nav>

        <div class="sidebar-divider"></div>

        <div class="sidebar-playlists-header">
          <span>Playlists</span>
          <button
            class="icon-btn small"
            data-action="open-create-playlist"
            type="button"
            aria-label="Create playlist"
          >
            <span class="material-symbols-rounded">add</span>
          </button>
        </div>

        <div class="sidebar-playlists" id="sidebar-playlists"></div>
      </aside>

      <!-- Main Stage -->
      <main class="main-stage" id="app-main" aria-live="polite"></main>

      <!-- Desktop Player Bar -->
      <footer
        class="player-bar"
        id="player-bar"
        aria-label="Now playing"
      ></footer>

      <!-- Mobile Mini Player -->
      <div class="mini-player" id="mini-player" aria-label="Mini player"></div>

      <!-- Mobile Bottom Nav -->
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <button class="mobile-nav-item active" data-route="/" type="button" aria-label="Home" title="Home">
          <div class="mobile-nav-pill">
            <span class="material-symbols-rounded">home</span>
          </div>
        </button>
        <button class="mobile-nav-item" data-route="/search" type="button" aria-label="Search" title="Search">
          <div class="mobile-nav-pill">
            <span class="material-symbols-rounded">search</span>
          </div>
        </button>
        <button class="mobile-nav-item" data-route="/library" type="button" aria-label="Your Library" title="Your Library">
          <div class="mobile-nav-pill">
            <span class="material-symbols-rounded">library_music</span>
          </div>
        </button>
        <button class="mobile-nav-item" data-route="/you" type="button" aria-label="You" title="You">
          <div class="mobile-nav-pill">
            <span class="material-symbols-rounded">account_circle</span>
          </div>
        </button>
      </nav>
    </div>

    <!-- Panels & Modals -->
    <div class="fullscreen-player" id="fullscreen-player"></div>
    <div class="panel-backdrop" id="panel-backdrop"></div>
    <div class="lyrics-panel" id="lyrics-panel"></div>
    <div class="artist-profile" id="artist-profile"></div>
    <div class="queue-panel" id="queue-panel"></div>
    <div id="overlay-root"></div>

    <!-- Background & Floating YouTube Audio/Video Engine -->
    <div id="yt-player-container" class="yt-player-container">
      <div class="yt-player-header">
        <span>Now Playing Video</span>
        <button
          type="button"
          class="yt-player-close"
          data-action="toggle-video"
          aria-label="Minimize video"
        >
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      <div id="yt-player-host"></div>
    </div>

    <!-- Native HTMLMediaElement Audio Player for PWA Background Playback & OS Media Session -->
    <audio
      id="pawtify-native-audio"
      preload="auto"
      playsinline
      loop
      style="display: none"
      src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"
    ></audio>

    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        const banner = document.getElementById('pwa-install-banner');
        if (banner) banner.style.display = 'block';
      });
      document.addEventListener('click', (e) => {
        const installBtn = e.target.closest('#pwa-install-btn');
        const closeBtn = e.target.closest('#pwa-install-close');
        const banner = document.getElementById('pwa-install-banner');
        if (installBtn && window.deferredPrompt) {
          window.deferredPrompt.prompt();
          window.deferredPrompt.userChoice.then(() => {
            window.deferredPrompt = null;
          });
          if (banner) banner.style.display = 'none';
        }
        if (closeBtn && banner) banner.style.display = 'none';
      });
    </script>
    <script type="module" src="/src/main.js?v=3.0.0-md3"></script>
  </body>
</html>
